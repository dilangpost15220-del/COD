<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>โปรแกรมถ่ายภาพเพื่อสั่งจอง PC ฟุตบอลโลก 2026</title>
<style>
  :root {
    --primary: #DC2626;
    --primary-light: #EF4444;
    --primary-dark: #991B1B;
    --bg: #F9FAFB;
    --card: #FFFFFF;
    --text: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --success: #10B981;
    --error: #DC2626;
    --warning: #F59E0B;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding: 0; max-width: 100%; min-height: 100vh; }
  .app-container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }

  .header {
    background: linear-gradient(135deg, #000000 0%, #DC2626 100%);
    color: white;
    padding: 20px 16px 24px;
    text-align: center;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 20px rgba(220,38,38,0.3);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.1)} }
  .header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; position: relative; line-height: 1.4; }
  .header p { font-size: 0.8rem; opacity: 0.9; position: relative; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    margin: 12px 12px;
  }

  /* ========== CAMERA ========== */
  .camera-wrapper {
    width: 100%;
    position: relative;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }
  .camera-wrapper.active { display: block; }

  #cameraPreview {
    width: 100%;
    display: block;
    /* ไม่กำหนด height — ให้กล้องแสดง aspect-ratio จริงของอุปกรณ์ */
  }

  /* กรอบเล็งบัตร — วาด overlay ทับวิดีโอ */
  .card-frame-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* เส้นกรอบสีขาว อัตราส่วน 1.586:1 (บัตร 85.6×54mm) */
  .card-frame-box {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 88%;
    aspect-ratio: 1.586 / 1;
    border: 2.5px solid rgba(255,255,255,0.9);
    border-radius: 10px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.52);
  }
  .card-frame-box::before {
    content: '🪪  วางบัตรให้อยู่ในกรอบ';
    position: absolute;
    top: -30px; left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .card-frame-box::after {
    content: 'ถือนิ่งๆ แล้วกดถ่าย';
    position: absolute;
    bottom: -26px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 0.75rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  .camera-toggle {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,255,255,0.9);
    border: none; border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer; font-size: 1.1rem; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .camera-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    display: flex; gap: 8px; justify-content: center;
  }

  /* ========== PREVIEW ========== */
  .preview-box {
    width: 100%;
    background: #fff;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 12px;
    min-height: 180px;
  }
  .preview-box img {
    max-width: 100%;
    max-height: 460px;
    width: auto; height: auto;
    object-fit: contain;
    display: none;
    border-radius: 8px;
  }
  .preview-box img.active { display: block !important; }
  .preview-box .placeholder { color: var(--text-muted); text-align: center; padding: 20px; }
  .preview-box .placeholder.hidden { display: none !important; }
  .placeholder-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .placeholder-text { font-size: 0.85rem; }

  /* ========== BUTTONS ========== */
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 14px 16px; border: none; border-radius: 12px;
    font-weight: 600; font-size: 0.9rem; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #F3F4F6; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: #FEE2E2; color: var(--error); }
  .btn-success { background: var(--success); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
  .btn-warning { background: #FEF3C7; color: #92400E; }
  .btn-large { padding: 16px; font-size: 1rem; }
  .btn-icon { flex: 0 0 auto; width: 44px; height: 44px; padding: 0; }

  /* ========== STATUS ========== */
  .status {
    margin: 8px 12px; padding: 10px 16px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 500;
    display: none; align-items: center; gap: 8px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  .status.loading { display: flex; background: #FEF3C7; color: #92400E; }
  .status.success { display: flex; background: #D1FAE5; color: #065F46; }
  .status.error   { display: flex; background: #FEE2E2; color: #991B1B; }

  /* ========== FORM ========== */
  .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .section-title h3 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .section-title span { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 0.95rem; transition: all 0.2s; background: #F9FAFB;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(220,38,38,0.1); background: #fff;
  }
  .form-group textarea { min-height: 70px; resize: vertical; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }

  /* ========== SETTINGS ========== */
  .settings-card { display: none; }
  .settings-card.active { display: block; }
  .settings-tip {
    background: linear-gradient(135deg, #FEF2F2, #FEE2E2);
    padding: 12px; border-radius: 10px;
    font-size: 0.8rem; color: var(--primary-dark);
    margin-bottom: 12px; line-height: 1.5;
  }

  /* ========== HISTORY ========== */
  .history-list { max-height: 200px; overflow-y: auto; }
  .history-item {
    padding: 12px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .history-item:last-child { border-bottom: none; }
  .history-name { font-weight: 600; font-size: 0.9rem; }
  .history-addr { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .history-time { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
  .history-empty { color: var(--text-muted); text-align: center; padding: 24px; font-size: 0.85rem; }

  /* ========== BOTTOM BAR ========== */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; padding: 12px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    display: flex; gap: 8px; z-index: 100;
  }
  .bottom-bar .btn { padding: 14px; }
  .spacer { height: 80px; }

  .hidden { display: none !important; }
  input[type="file"] { display: none; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

  <!-- ตั้งค่า -->

<script>
/* ============================================================
   CONFIG
============================================================ */
const CONFIG = {
  OCR_API_KEY: 'K89547989888957',
  SHEETS_URL:  'https://script.google.com/macros/s/AKfycbz--nqIv3WPRVJ_2_92zWmP7cSzeiZMNoibdZ7eb-5RKAkDHcJwX0YvPVwEEmz8HzGtSA/exec',
  SHEET_NAME:  'OCR_Records'
};

/* ============================================================
   STATE
============================================================ */
let currentStream      = null;
let currentFacingMode  = 'environment';
let capturedImageBlob  = null;
let capturedImageUrl   = null;

/* ============================================================
   DOM refs
============================================================ */
const $ = id => document.getElementById(id);
const cameraWrapper      = $('cameraWrapper');
const cameraPreview      = $('cameraPreview');
const captureCanvas      = $('captureCanvas');
const mainButtons        = $('mainButtons');
const captureButtons     = $('captureButtons');
const previewBox         = $('previewBox');
const previewImg         = $('previewImg');
const previewPlaceholder = $('previewPlaceholder');
const statusBox          = $('statusBox');
const cardFrameBox       = $('cardFrameBox');

/* ============================================================
   STATUS
============================================================ */
function setStatus(msg, type = 'loading') {
  statusBox.textContent = msg;
  statusBox.className = `status ${type}`;
  if (type !== 'error') setTimeout(() => { statusBox.className = 'status'; }, 4000);
}

/* ============================================================
   PREVIEW helpers
============================================================ */
function showPreview(url) {
  if (capturedImageUrl) URL.revokeObjectURL(capturedImageUrl);
  capturedImageUrl = url;
  previewImg.src = url;
  previewImg.classList.add('active');
  previewPlaceholder.classList.add('hidden');
}
function hidePreview() {
  if (capturedImageUrl) { URL.revokeObjectURL(capturedImageUrl); capturedImageUrl = null; }
  previewImg.src = '';
  previewImg.classList.remove('active');
  previewPlaceholder.classList.remove('hidden');
}

/* ============================================================
   CAMERA
============================================================ */
async function startCamera() {
  try {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    currentStream = stream;
    cameraPreview.srcObject = stream;
    cameraWrapper.classList.add('active');
    previewBox.style.display = 'none';
    mainButtons.classList.add('hidden');
  } catch {
    setStatus('❌ ไม่สามารถเข้าถึงกล้องได้', 'error');
  }
}

function stopCamera() {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  cameraWrapper.classList.remove('active');
}

function toggleCamera() {
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  startCamera();
}

/* ============================================================
   CAPTURE — crop เฉพาะบริเวณกรอบบัตร
============================================================ */
function captureImage() {
  if (!currentStream) return;

  const vw = cameraPreview.videoWidth;
  const vh = cameraPreview.videoHeight;

  /* คำนวณ pixel ที่ตรงกับกรอบ card-frame-box บน element จริง */
  const previewEl   = cameraPreview.getBoundingClientRect();
  const frameEl     = cardFrameBox.getBoundingClientRect();

  /* อัตราส่วน video จริง / element ที่แสดงบนหน้าจอ */
  const scaleX = vw / previewEl.width;
  const scaleY = vh / previewEl.height;

  /* พิกัดกรอบในพื้นที่ video จริง */
  const cropX = (frameEl.left - previewEl.left) * scaleX;
  const cropY = (frameEl.top  - previewEl.top)  * scaleY;
  const cropW = frameEl.width  * scaleX;
  const cropH = frameEl.height * scaleY;

  /* ขยาย margin เล็กน้อยเพื่อความปลอดภัย 4% */
  const margin = 0.04;
  const mx = cropW * margin;
  const my = cropH * margin;
  const sx = Math.max(0, cropX - mx);
  const sy = Math.max(0, cropY - my);
  const sw = Math.min(vw - sx, cropW + mx * 2);
  const sh = Math.min(vh - sy, cropH + my * 2);

  captureCanvas.width  = Math.round(sw);
  captureCanvas.height = Math.round(sh);
  const ctx = captureCanvas.getContext('2d');
  ctx.drawImage(cameraPreview, sx, sy, sw, sh, 0, 0, sw, sh);

  captureCanvas.toBlob(blob => {
    capturedImageBlob = blob;
    const url = URL.createObjectURL(blob);
    showPreview(url);
    stopCamera();
    captureButtons.classList.remove('hidden');
    mainButtons.classList.add('hidden');
    previewBox.style.display = 'flex';
  }, 'image/jpeg', 0.92);
}

/* ============================================================
   BUTTON EVENTS — camera
============================================================ */
$('btnCamera').addEventListener('click', startCamera);
$('btnToggleCamera').addEventListener('click', toggleCamera);
$('btnCapture').addEventListener('click', captureImage);
$('btnCancelCamera').addEventListener('click', () => {
  capturedImageBlob = null;
  stopCamera();
  captureButtons.classList.add('hidden');
  mainButtons.classList.remove('hidden');
  hidePreview();
  previewBox.style.display = 'flex';
});
$('btnRetake').addEventListener('click', () => {
  capturedImageBlob = null;
  captureButtons.classList.add('hidden');
  mainButtons.classList.remove('hidden');
  hidePreview();
  previewBox.style.display = 'flex';
  startCamera();
});
$('btnUsePhoto').addEventListener('click', () => {
  if (capturedImageBlob) handleFile(capturedImageBlob);
});
$('btnReset').addEventListener('click', () => {
  capturedImageBlob = null;
  stopCamera();
  captureButtons.classList.add('hidden');
  mainButtons.classList.remove('hidden');
  hidePreview();
  previewBox.style.display = 'flex';
});

/* ============================================================
   GALLERY
============================================================ */
$('galleryInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  capturedImageBlob = file;
  const url = URL.createObjectURL(file);
  showPreview(url);
  mainButtons.classList.add('hidden');
  captureButtons.classList.remove('hidden');
  previewBox.style.display = 'flex';
});
$('btnGallery').addEventListener('click', () => $('galleryInput').click());

/* ============================================================
   IMAGE ENHANCEMENT
============================================================ */
function enhanceImage(imageFile) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx    = canvas.getContext('2d');
        const maxDim = 1400;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const r = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        canvas.width = w; canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          const val  = Math.min(255, Math.max(0, ((gray - 128) * 1.4) + 128));
          d[i] = d[i+1] = d[i+2] = val;
        }
        ctx.putImageData(imgData, 0, 0);
        canvas.toBlob(resolve, 'image/jpeg', 0.88);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(imageFile);
  });
}

/* ============================================================
   OCR PARSE
============================================================ */
function parseThaiID(ocrText) {
  const lines = ocrText.split('\n').map(l => l.trim()).filter(Boolean);
  let name = '', address = '', isAddr = false;

  const skipHeader = /Thai National ID Card|บัตรประจำตัวประชาชน|Identification Number/i;
  const stopAddr   = /Date of Issue|วันออกบัตร|ลงชื่อ|Date of Expiry|วันหมดอายุ|วันที่ออก|Signature/i;
  const dateFmt    = /\d{1,2}\s*[ก-ย]\.\s*\d{4}|\d{1,2}\s*[A-Za-z]+\.\s*\d{4}/;
  const titleRE    = /นาย|นางสาว|นาง|น\.s\.?|ด\.ญ\.?|ด\.ช\.?|พระ|สามเณร|Miss|Mrs\.?|Mr\.?|Master/i;
  const placeRE    = /ร้อย|ห้าง|ศูนย์การค้า|เซ็นทรัล|โลตัส|บิ๊กซี|ร้าน/i;
  const namePfx    = /ชื่อตัวและชื่อสกุล|ชื่อ-สกุล|Name|ชื่อ|นาม/i;

  for (const line of lines) {
    if (skipHeader.test(line)) continue;
    if (!name) {
      if (titleRE.test(line) && line.length < 80) name = line.replace(namePfx, '').trim();
      else if (namePfx.test(line) && /[ก-๙a-zA-Z]/.test(line) && !/Thai|National|Card|Identification/i.test(line))
        name = line.replace(namePfx, '').trim();
    }
    if (line.includes('ที่อยู่') || line.includes('บ้านเลขที่')) {
      isAddr = true;
      address = line.replace(/ที่อยู่|บ้านเลขที่/gi, '').trim();
      continue;
    }
    if (isAddr) {
      if (stopAddr.test(line) || dateFmt.test(line)) { isAddr = false; }
      else if (placeRE.test(line)) {
        const part = line.split(/ร้อย|ห้าง|ศูนย์/)[0];
        if (part.trim()) address += ' ' + part.trim();
        isAddr = false;
      } else if (!/Name:|Last Name:|Date of Birth|Identification/i.test(line)) {
        address += ' ' + line;
      }
    }
  }
  return { name: name.replace(/\s+/g,' ').trim(), address: address.replace(/\s+/g,' ').trim() };
}

/* ============================================================
   HANDLE FILE → OCR
============================================================ */
async function handleFile(file) {
  captureButtons.classList.add('hidden');
  setStatus('🔍 กำลังวิเคราะห์บัตร...', 'loading');
  try {
    const key = localStorage.getItem('ocr_api_key') || $('apiKey').value.trim() || CONFIG.OCR_API_KEY;
    const enhanced = await enhanceImage(file);
    const form = new FormData();
    form.append('file', enhanced, 'id_card.jpg');
    form.append('apikey', key);
    form.append('language', 'tha');
    form.append('OCREngine', '2');
    form.append('scale', 'true');
    form.append('detectOrientation', 'true');
    form.append('isOverlayRequired', 'false');

    const res  = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: form });
    const data = await res.json();
    if (data.OCRExitCode !== 1) throw new Error(data.ErrorMessage || 'OCR Failed');

    const parsed = parseThaiID(data.ParsedResults[0].ParsedText);
    $('fullName').value = parsed.name;
    $('address').value  = parsed.address;
    $('notes').value = $('workerCode').value = $('postalCode').value = $('phone').value = '';
    $('quantity').value = 1;
    setStatus('✅ สแกนสำเร็จ', 'success');
  } catch (err) {
    setStatus(`❌ ${err.message}`, 'error');
    captureButtons.classList.remove('hidden');
  }
}

/* ============================================================
   SETTINGS
============================================================ */
function loadSettings() {
  $('apiKey').value   = localStorage.getItem('ocr_api_key') || CONFIG.OCR_API_KEY;
  $('sheetsUrl').value= localStorage.getItem('sheets_url')  || CONFIG.SHEETS_URL;
  $('sheetName').value= localStorage.getItem('sheet_name')  || CONFIG.SHEET_NAME;
}
loadSettings();

$('btnSettings').onclick = () => {
  $('settingsCard').classList.toggle('active');
  if ($('settingsCard').classList.contains('active'))
    $('settingsCard').scrollIntoView({ behavior:'smooth', block:'center' });
};
$('btnCloseSettings').onclick = () => {
  localStorage.setItem('ocr_api_key', $('apiKey').value.trim());
  localStorage.setItem('sheets_url',  $('sheetsUrl').value.trim());
  localStorage.setItem('sheet_name',  $('sheetName').value.trim());
  $('settingsCard').classList.remove('active');
  setStatus('✅ บันทึกการตั้งค่าแล้ว', 'success');
};
$('btnTestConn').onclick = async () => {
  const key = $('apiKey').value.trim() || CONFIG.OCR_API_KEY;
  if (!key) return setStatus('❌ กรุณากรอก API Key', 'error');
  setStatus('🔄 กำลังทดสอบ...', 'loading');
  try {
    const res  = await fetch('https://api.ocr.space/parse/image', {
      method: 'POST', headers: { apikey: key },
      body: new URLSearchParams({ language:'tha', OCREngine:'2', url:'https://ocr.space/Content/Images/demo.jpg' })
    });
    const data = await res.json();
    setStatus(data.OCRExitCode === 1 ? '✅ API Key ใช้งานได้' : '❌ API Key ไม่ถูกต้อง', data.OCRExitCode === 1 ? 'success' : 'error');
  } catch { setStatus('❌ ไม่สามารถเชื่อมต่อได้', 'error'); }
};

/* ============================================================
   SAVE TO SHEETS
============================================================ */
$('btnSaveSheets').onclick = async () => {
  const url = localStorage.getItem('sheets_url') || $('sheetsUrl').value.trim() || CONFIG.SHEETS_URL;
  if (!url) return setStatus('⚠️ กรุณาตั้งค่า Google Sheets URL', 'error');
  setStatus('📤 กำลังบันทึก...', 'loading');
  const payload = {
    action:   'insert',
    sheet:    localStorage.getItem('sheet_name') || $('sheetName').value.trim() || CONFIG.SHEET_NAME,
    fullname: $('fullName').value,
    address:  $('address').value,
    note:     $('notes').value,
    assignee: $('workerCode').value,
    postcode: $('postalCode').value,
    phone:    $('phone').value,
    qty:      parseInt($('quantity').value) || 1,
    time:     new Date().toISOString(),
    status:   'pending'
  };
  try {
    await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, mode:'no-cors', body: JSON.stringify(payload) });
    setStatus('✅ บันทึกสำเร็จ', 'success');
    addHistory(payload);
    $('quantity').value = 1; $('notes').value = '';
  } catch (err) {
    setStatus(`❌ บันทึกไม่สำเร็จ: ${err.message}`, 'error');
  }
};

/* ============================================================
   HISTORY
============================================================ */
function addHistory(data) {
  const list = $('historyList');
  if (list.querySelector('.history-empty')) list.innerHTML = '';
  const item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = `
    <div>
      <div class="history-name">${data.fullname||'-'}</div>
      <div class="history-addr">${(data.address||'').substring(0,40)}…</div>
    </div>
    <div class="history-time">${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div>`;
  list.prepend(item);
}
$('btnClearHistory').onclick = () => {
  $('historyList').innerHTML = '<div class="history-empty">ยังไม่มีประวัติการบันทึก</div>';
};

/* ============================================================
   CLEANUP
============================================================ */
window.addEventListener('beforeunload', () => {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  if (capturedImageUrl) URL.revokeObjectURL(capturedImageUrl);
});
</script>
