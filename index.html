<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thai ID OCR Pro</title>
<style>
  :root {
    --primary: #4F46E5;
    --primary-light: #818CF8;
    --primary-dark: #3730A3;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --success: #10B981;
    --error: #EF4444;
    --warning: #F59E0B;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding: 0; max-width: 100%; min-height: 100vh; }
  
  .app-container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
  
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 20px 16px 24px;
    text-align: center;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 20px rgba(79,70,229,0.3);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; position: relative; }
  .header p { font-size: 0.8rem; opacity: 0.9; position: relative; }
  
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    margin: 12px 12px;
  }
  
  .camera-container {
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    display: none;
  }
  .camera-container.active { display: block; }
  #cameraPreview { width: 100%; height: 100%; object-fit: cover; }
  .camera-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 85%; height: 55%;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 12px;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
  }
  .camera-overlay::before {
    content: '🪪 วางบัตรให้อยู่ในกรอบ';
    position: absolute;
    top: -28px; left: 0; right: 0;
    text-align: center;
    color: white;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .camera-overlay::after {
    content: 'ถือนิ่งๆ แล้วกดถ่ายกล้องหลัง';
    position: absolute;
    bottom: -28px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.8);
    font-size: 0.75rem;
  }
  .camera-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    display: flex; gap: 8px; justify-content: center;
  }
  .camera-toggle {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,255,255,0.9);
    border: none; border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  
  .preview-box {
    width: 100%;
    aspect-ratio: 16/9;
    background: #F8FAFC;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease;
  }
  .preview-box img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }
  .preview-box img.active { display: block; }
  .preview-box .placeholder {
    color: var(--text-muted);
    text-align: center;
    padding: 20px;
  }
  .preview-box .placeholder.hidden { display: none; }
  .preview-box .placeholder-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .preview-box .placeholder-text { font-size: 0.85rem; }
  
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(79,70,229,0.3);
  }
  .btn-secondary { background: #F1F5F9; color: var(--text); }
  .btn-danger { background: #FEE2E2; color: var(--error); }
  .btn-success {
    background: var(--success);
    color: white;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
  }
  .btn-warning { background: #FEF3C7; color: #92400E; }
  .btn-large { padding: 16px; font-size: 1rem; }
  .btn-icon { flex: 0 0 auto; width: 44px; height: 44px; padding: 0; }
  
  .status {
    margin: 8px 12px;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    display: none;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .status.loading { display: flex; background: #FEF3C7; color: #92400E; }
  .status.success { display: flex; background: #D1FAE5; color: #065F46; }
  .status.error { display: flex; background: #FEE2E2; color: #991B1B; }
  
  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .section-title h3 {
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title span {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    background: #F8FAFC;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    background: white;
  }
  .form-group textarea { min-height: 70px; resize: vertical; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }
  
  .settings-card { display: none; }
  .settings-card.active { display: block; }
  .settings-tip {
    background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
    padding: 12px;
    border-radius: 10px;
    font-size: 0.8rem;
    color: #1E40AF;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .settings-tip a { color: var(--primary); font-weight: 600; }
  
  .history-list { max-height: 200px; overflow-y: auto; }
  .history-item {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-item:last-child { border-bottom: none; }
  .history-name { font-weight: 600; font-size: 0.9rem; }
  .history-addr { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .history-time { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
  .history-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 24px;
    font-size: 0.85rem;
  }
  
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    padding: 12px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .bottom-bar .btn { padding: 14px; }
  .spacer { height: 80px; }
  
  .hidden { display: none !important; }
  input[type="file"] { display: none; }
  
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
<base target="_blank">

<body>

<div class="app-container">
  <div class="header">
    <h1>🪪 Thai ID OCR Pro</h1>
    <p>สแกนบัตรประชาชนด้วย AI OCR</p>
  </div>

  <div class="card" style="margin-top: -12px; position: relative; z-index: 1;">
    <div class="camera-container" id="cameraContainer">
      <video id="cameraPreview" autoplay playsinline></video>
      <canvas id="captureCanvas" style="display:none;"></canvas>
      <div class="camera-overlay"></div>
      <button class="camera-toggle" id="btnToggleCamera">🔄</button>
      <div class="camera-controls">
        <button class="btn btn-success" id="btnCapture" style="flex: 0 0 130px;">📸 ถ่ายภาพ</button>
        <button class="btn btn-danger" id="btnCancelCamera" style="flex: 0 0 80px;">✕ ยกเลิก</button>
      </div>
    </div>

    <div class="preview-box" id="previewBox">
      <div class="placeholder" id="previewPlaceholder">
        <div class="placeholder-icon">🪪</div>
        <div class="placeholder-text">แตะเพื่อเปิดกล้อง หรือใช้ปุ่มด้านล่าง</div>

    </div>

    </div>

    <div class="btn-row hidden" id="captureButtons">
      <button class="btn btn-warning" id="btnRetake">🔄 ถ่ายใหม่</button>
      <button class="btn btn-success" id="btnUsePhoto">✅ ใช้ภาพนี้</button>
      <button class="btn btn-danger btn-icon" id="btnReset">✕</button>

  <div id="statusBox" class="status"></div>

  <div class="card">
    <div class="section-title">

      <span>ดึงเฉพาะชื่อ/ที่อยู่</span>

    <div class="form-group">
      <label>ชื่อ-สกุล</label>
      <input type="text" id="fullName" placeholder="รอการสแกน...">

    <div class="form-group">
      <label>ที่อยู่</label>

    </div>

  <div class="card" id="settingsCard" style="display:none;">
    <div class="section-title">

    </div>
    <div class="settings-tip">
      ✅ API Key และ URL ถูกตั้งค่าไว้แล้วในโค้ด
    </div>
    <div class="form-group">
      <label>🔍 OCR.space API Key</label>
      <input type="text" id="apiKey" placeholder="วาง API Key ที่นี่">
    </div>
    <div class="form-group">
      <label>📊 Google Sheets URL</label>
      <input type="text" id="sheetsUrl" placeholder="https://script.google.com/macros/s/...">
    </div>
    <div class="form-group">
      <label>Sheet Name</label>
      <input type="text" id="sheetName" value="ชื่อ1">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnTestConn">🔗 ทดสอบ</button>
      <button class="btn btn-primary" id="btnCloseSettings"> บันทึก</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <h3>📊 ประวัติ</h3>
      <button class="btn btn-secondary btn-icon" id="btnClearHistory" style="width: 32px; height: 32px; font-size: 0.8rem;">🗑</button>
    </div>
    <div class="history-list" id="historyList">

</div>

<div class="bottom-bar">
  <button class="btn btn-primary btn-large" id="btnSaveSheets">📤 บันทึกลง Google Sheets</button>
  <button class="btn btn-secondary btn-icon btn-large" id="btnSettings" style="flex: 0 0 56px;">⚙️</button>
</div>

<script>
const CONFIG = {
  OCR_API_KEY: 'K89547989888957',
  SHEETS_URL: 'https://script.google.com/macros/s/AKfycbxruEkA-0NyO-w0Mcr8hnrWMplVOpOIZeO6DISCABwhLi-YcwuT8OOFcpKIToXAH5EVaQ/exec',
  SHEET_NAME: 'ชื่อ1'
};

let currentStream = null;
let currentFacingMode = 'environment';
let capturedImageBlob = null;

const cameraContainer = document.getElementById('cameraContainer');
const cameraPreview = document.getElementById('cameraPreview');
const captureCanvas = document.getElementById('captureCanvas');
const mainButtons = document.getElementById('mainButtons');
const captureButtons = document.getElementById('captureButtons');
const previewBox = document.getElementById('previewBox');
const previewImg = document.getElementById('previewImg');
const previewPlaceholder = document.getElementById('previewPlaceholder');

function showPreview(imageUrl) {
  previewImg.src = imageUrl;
  previewImg.classList.add('active');
  previewPlaceholder.classList.add('hidden');
}

function hidePreview() {
  previewImg.src = '';
  previewImg.classList.remove('active');
  previewPlaceholder.classList.remove('hidden');
}

async function startCamera() {
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }
    const constraints = {
      video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
    };
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    cameraPreview.srcObject = currentStream;
    cameraContainer.classList.add('active');
    previewBox.style.display = 'none';
    mainButtons.classList.add('hidden');
  } catch (err) {
    setStatus('❌ ไม่สามารถเข้าถึงกล้องได้', 'error');
  }
}

function stopCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
  }
  cameraContainer.classList.remove('active');
  if (!capturedImageBlob) {
    previewBox.style.display = 'flex';
    mainButtons.classList.remove('hidden');
  }
}

function toggleCamera() {
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  startCamera();
}

function captureImage() {
  if (!currentStream) return;
  captureCanvas.width = cameraPreview.videoWidth;
  captureCanvas.height = cameraPreview.videoHeight;
  const ctx = captureCanvas.getContext('2d');
  ctx.drawImage(cameraPreview, 0, 0);
  captureCanvas.toBlob((blob) => {
    capturedImageBlob = blob;
    const url = URL.createObjectURL(blob);
    showPreview(url);
    cameraContainer.classList.remove('active');
    captureButtons.classList.remove('hidden');
    mainButtons.classList.add('hidden');
    stopCamera();
  }, 'image/jpeg', 0.9);
}

function useCapturedImage() {
  if (capturedImageBlob) handleFile(capturedImageBlob);
}

function retakePhoto() {
  capturedImageBlob = null;
  captureButtons.classList.add('hidden');
  mainButtons.classList.remove('hidden');
  hidePreview();
  startCamera();
}

function cancelCamera() {
  capturedImageBlob = null;
  stopCamera();
  captureButtons.classList.add('hidden');
  mainButtons.classList.remove('hidden');
  hidePreview();
  setStatus('');
}

document.getElementById('btnCamera').addEventListener('click', startCamera);
document.getElementById('btnToggleCamera').addEventListener('click', toggleCamera);
document.getElementById('btnCapture').addEventListener('click', captureImage);
document.getElementById('btnCancelCamera').addEventListener('click', cancelCamera);
document.getElementById('btnRetake').addEventListener('click', retakePhoto);
document.getElementById('btnUsePhoto').addEventListener('click', useCapturedImage);
document.getElementById('btnReset').addEventListener('click', cancelCamera);

const PREPROCESS = {
  enhanceImage(imageFile) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            const r = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          const imgData = ctx.getImageData(0, 0, w, h);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            const val = Math.min(255, Math.max(0, ((gray - 128) * 1.4) + 128));
            data[i] = data[i + 1] = data[i + 2] = val;
          }
          ctx.putImageData(imgData, 0, 0);
          canvas.toBlob(resolve, 'image/jpeg', 0.85);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(imageFile);
    });
  },

  parseThaiID(ocrText) {
    const lines = ocrText.split('\n').map(l => l.trim()).filter(Boolean);
    let name = '';
    let address = '';
    let isCapturingAddr = false;

    const skipHeader = /Thai National ID Card|บัตรประจำตัวประชาชน|Identification Number/i;
    const stopAddr = /Date of Issue|วันออกบัตร|ลงชื่อ|Date of Expiry|วันหมดอายุ|วันที่ออก|Signature/i;
    const dateFmt = /\d{1,2}\s*[ก-ย]\.\s*\d{4}|\d{1,2}\s*[A-Za-z]+\.\s*\d{4}/;
    const titleNames = /นาย|นางสาว|นาง|น\.s\.?|ด\.ญ\.?|ด\.ช\.?|พระ|สามเณร|Miss|Mrs\.?|Mr\.?|Master/i;
    const placeNames = /ร้อย|ห้าง|ศูนย์การค้า|เซ็นทรัล|โลตัส|บิ๊กซี|ร้าน/i;
    const namePrefixes = /ชื่อตัวและชื่อสกุล|ชื่อ-สกุล|Name|ชื่อ|นาม/i;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      
      if (skipHeader.test(line)) continue;

      if (!name) {
        if (titleNames.test(line) && line.length < 80) {
          name = line.replace(namePrefixes, '').trim();
        }
        else if (namePrefixes.test(line)) {
          if (/[ก-๙a-zA-Z]/.test(line) && !/Thai|National|Card|Identification/i.test(line)) {
            name = line.replace(namePrefixes, '').trim();
          }
        }
      }

      if (line.includes('ที่อยู่') || line.includes('บ้านเลขที่')) {
        isCapturingAddr = true;
        address = line.replace(/ที่อยู่|บ้านเลขที่/gi, '').trim();
        continue;
      }

      if (isCapturingAddr) {
        if (stopAddr.test(line) || dateFmt.test(line)) {
          isCapturingAddr = false; 
        } 
        else if (placeNames.test(line)) {
          const splitAddr = line.split(/ร้อย|ห้าง|ศูนย์/)[0];
          if(splitAddr.trim()) address += ' ' + splitAddr.trim();
          isCapturingAddr = false;
        }
        else {
          if (!/Name:|Last Name:|Date of Birth|Identification/i.test(line)) {
            address += ' ' + line;
          }
        }
      }
    }

    return {
      name: name.replace(/\s+/g, ' ').trim(),
      address: address.replace(/\s+/g, ' ').trim()
    };
  }
};

const $ = (id) => document.getElementById(id);
const statusBox = $('statusBox');

function setStatus(msg, type = 'loading') {
  statusBox.textContent = msg;
  statusBox.className = `status ${type}`;
  if (type === 'loading') {
    setTimeout(() => { statusBox.className = 'status'; }, 5000);
  }
}

function loadSettings() {
  $('apiKey').value = localStorage.getItem('ocr_api_key') || CONFIG.OCR_API_KEY;
  $('sheetsUrl').value = localStorage.getItem('sheets_url') || CONFIG.SHEETS_URL;
  $('sheetName').value = localStorage.getItem('sheet_name') || CONFIG.SHEET_NAME;
}
loadSettings();

let secretTapCount = 0;
let secretTapTimer = null;
$('btnSettings').onclick = () => {
  secretTapCount++;
  clearTimeout(secretTapTimer);
  secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);
  if (secretTapCount >= 5) {
    secretTapCount = 0;
    const card = $('settingsCard');
    const isVisible = card.style.display !== 'none';
    card.style.display = isVisible ? 'none' : 'block';
    if (!isVisible) card.scrollIntoView({ behavior: 'smooth' });
  }
};
$('btnCloseSettings').onclick = () => {
  localStorage.setItem('ocr_api_key', $('apiKey').value.trim());
  localStorage.setItem('sheets_url', $('sheetsUrl').value.trim());
  localStorage.setItem('sheet_name', $('sheetName').value.trim());
  $('settingsCard').style.display = 'none';
  setStatus('✅ บันทึกการตั้งค่าแล้ว', 'success');
};

$('btnTestConn').onclick = async () => {
  const key = $('apiKey').value.trim() || CONFIG.OCR_API_KEY;
  if (!key) return setStatus('❌ กรุณากรอก API Key', 'error');
  setStatus('🔄 กำลังทดสอบ...', 'loading');
  try {
    const res = await fetch('https://api.ocr.space/parse/image', {
      method: 'POST',
      headers: { 'apikey': key },
      body: new URLSearchParams({ language: 'tha', OCREngine: '2', url: 'https://ocr.space/Content/Images/demo.jpg' })
    });
    const data = await res.json();
    if (data.OCRExitCode === 1) setStatus('✅ API Key ใช้งานได้', 'success');
    else setStatus('❌ API Key ไม่ถูกต้อง', 'error');
  } catch { setStatus('❌ ไม่สามารถเชื่อมต่อได้', 'error'); }
};

$('galleryInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    capturedImageBlob = file;
    const url = URL.createObjectURL(file);
    showPreview(url);
    mainButtons.classList.add('hidden');
    captureButtons.classList.remove('hidden');
  }
});

$('btnGallery').onclick = () => $('galleryInput').click();

async function handleFile(file) {
  if (!file) return;
  captureButtons.classList.add('hidden');
  await runOCR(file);
}

async function runOCR(file) {
  const key = localStorage.getItem('ocr_api_key') || $('apiKey').value.trim() || CONFIG.OCR_API_KEY;
  
  setStatus('🔍 กำลังวิเคราะห์บัตร...', 'loading');
  try {
    const enhancedBlob = await PREPROCESS.enhanceImage(file);
    const formData = new FormData();
    formData.append('file', enhancedBlob, 'id_card.jpg');
    formData.append('apikey', key);
    formData.append('language', 'tha');
    formData.append('OCREngine', '2');
    formData.append('scale', 'true');
    formData.append('detectOrientation', 'true');
    formData.append('isOverlayRequired', 'false');
    
    const res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: formData });
    const data = await res.json();
    
    if (data.OCRExitCode !== 1) throw new Error(data.ErrorMessage || 'OCR Failed');
    
    const parsed = PREPROCESS.parseThaiID(data.ParsedResults[0].ParsedText);
    $('fullName').value = parsed.name;
    $('address').value = parsed.address;
    $('notes').value = '';
    $('workerCode').value = '';
    $('postalCode').value = '';
    $('phone').value = '';
    $('quantity').value = 1;

    setStatus('✅ สแกนสำเร็จ', 'success');
  } catch (err) {
    setStatus(`❌ ${err.message}`, 'error');
  }
}

$('btnSaveSheets').onclick = async () => {
  const url = localStorage.getItem('sheets_url') || $('sheetsUrl').value.trim() || CONFIG.SHEETS_URL;
  
  if (!url) {
    return setStatus('⚠️ กรุณาตั้งค่า Google Sheets URL', 'error');
  }
  
  setStatus('📤 กำลังบันทึก...', 'loading');
  
  const payload = {
    action: 'insert',
    sheet: localStorage.getItem('sheet_name') || $('sheetName').value.trim() || CONFIG.SHEET_NAME,
    fullname: $('fullName').value,
    address: $('address').value,
    note: $('notes').value,
    assignee: $('workerCode').value,
    postcode: $('postalCode').value,
    phone: $('phone').value,
    qty: parseInt($('quantity').value) || 1,
    time: (() => { const d = new Date(); const pad = n => String(n).padStart(2,'0'); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); })(),
    status: 'pending'
  };
  
  console.log('Sending data:', payload);
  console.log('To URL:', url);
  
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      mode: 'no-cors',
      body: JSON.stringify(payload)
    });
    
    console.log('Response status:', response.status);
    
    setStatus('✅ บันทึกสำเร็จ', 'success');
    addHistory(payload);
    $('quantity').value = 1; 
    $('notes').value = '';
    
  } catch (error) {
    console.error('Error:', error);
    setStatus(`❌ บันทึกไม่สำเร็จ: ${error.message}`, 'error');
  }
};

function addHistory(data) {
  const list = $('historyList');
  if (list.querySelector('.history-empty')) list.innerHTML = '';
  const item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = `
    <div>
      <div class="history-name">${data.fullname || '-'}</div>
      <div class="history-addr">${(data.address || '').substring(0, 40)}...</div>
    </div>
    <div class="history-time">${new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit'})}</div>
  `;
  list.prepend(item);
}

$('btnClearHistory').onclick = () => {
  $('historyList').innerHTML = '<div class="history-empty">ยังไม่มีประวัติการบันทึก</div>';
};

window.addEventListener('beforeunload', () => {
  if (currentStream) currentStream.getTracks().forEach(track => track.stop());
});
</script>
